<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .i1{
            width: 300px;
            height: 300px;
            border-radius: 30px;
            padding:20px;
            background-color: black;
            border: 3px solid red;
        }
        .i2{
            border-top-left-radius: 2px;
            border-bottom-left-radius: 30px;
            border-top-right-radius: 30px;
            border-bottom-right-radius: 40px;
        }
        .i3{
            border-radius: 5px;
            border:1px solid black;
            padding: 10px;
            height: 250px;
            width: 200px;
        }
        /* Transperant & responsive */
        .i4{
            width:900px;
            height: 400px;
            border: 1px solid red;
            opacity: 0.3;
        }
        .i5{
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <img src="image.jpg" class="i1" alt="img">
    <img src="download.jfif" class="i2" alt="img">
    <img src="download (1).jfif" class="i3" alt="img">
    <img src="download (1).jfif" class="i4" alt="img">
    <img src="download.jfif" class="i5" alt="img">
</body>
</html>
