<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <table border="5" cellpadding="30" cellspacing="3" rules="all" width="60%">
    <caption>Table example</caption>
    <thead>
      <tr>
        <th>Roll Number</th>
        <th>Name</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>ABC</td>
      </tr>
      <tr>
        <td>2</td>
        <td>XYZ</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <th>Total</th>
        <td>2</td>
      </tr>
    </tfoot>
  </table> 
</body>
</html>
