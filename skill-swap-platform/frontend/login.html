<!-- frontend/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - SkillSwap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">SkillSwap</a>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="text-center">Login</h2>
    <form class="mx-auto card p-4 shadow-sm" style="max-width: 420px;">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" required/>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
      <p class="text-center mt-3">
        No account? <a href="signup.html">Sign up</a>
      </p>
    </form>
  </div>

  <footer class="text-center mt-5 text-muted">
    <p>Demo only. No data is stored.</p>
  </footer>
</body>
</html>
