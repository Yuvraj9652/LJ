<!-- frontend/signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - SkillSwap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/main.js" defer></script>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">SkillSwap</a>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="text-center">Create your account</h2>
    <form class="mx-auto card p-4 shadow-sm" style="max-width: 480px;" onsubmit="return validateSignup()">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input id="name" type="text" class="form-control" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input id="email" type="email" class="form-control" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="form-control" minlength="6" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <input id="confirmPassword" type="password" class="form-control" minlength="6" required/>
      </div>
      <button type="submit" class="btn btn-success w-100">Sign up</button>
      <p class="text-center mt-3">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </form>
  </div>

  <footer class="text-center mt-5 text-muted">
    <p>Demo only. Client-side validation for preview.</p>
  </footer>
</body>
</html>
