{% extends 'nav.html' %}
{% block title %}Edit{% endblock %}
{% block content %}

        {% csrf_token %}
        Name: <input name="name" type="text" value={{ p.name }}><br><br>

        <input type="submit" value="Update">
    </form>
{% endblock %}
