<script>
    const sum=a=>a*a;
    console.log(sum(5));
    const sum1=(a)=>a*a;
    console.log(sum(6));
    const sum2=(a)=>{a*a};
    console.log(sum2(7));
    const sum3=a=>{a*a};
    console.log(sum3(8));
    const print=()=>`Hello!`;
    console.log(print());
    const mul=(a,b)=>`Multi. is ${a*b}`;
    console.log(mul(10,20));
    const div=(a,b)=>a/b;
    console.log(`Division is ${div(10,20)}`);
    const mul1=(a)=>{
        var x=a*a;
        return x;
    };
    console.log(`Square is ${mul1(10)}`);
    const mul2=(a,b)=>`Multi. is ${a*b}`;
    console.log(mul2(10,20));
    function abc(a,b){
        console.log(a,b);
    }
    function xyz(a,b,...c){//... is used to store more than 1 values in array
        console.log(a,b,c);
        console.log(c[0]);
        console.log(c.length);
        console.log(c.indexOf("abc"));
        console.log(c.indexOf("pqr"));
    }
    abc(1,3,4,6,7);
    xyz("abc","xyz","pqr","mno","xyz");
</script>
