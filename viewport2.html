<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
        }
        nav{
            background: lightpink;
            padding: 10px;
            width: 40%;
        }
        section{
            background: lightblue;
            padding: 10px;
            text-align: center;
            width: 60%;
        }
        .i1{
            display: none;
        }
        .i1{
            width: 150px;
            height: 150px;
        }
        @media (max-width:500px) {
            .container{
                flex-direction: column;
            }
            nav{
               order: -1; 
            }
            nav,section{
                width: 100%;
            }
            .i1{
                display: block;
            }
            .i1{
                display:100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <section>
            <h1>Hi</h1>
            <img src="img.png" class="i1">
        </section>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
        </nav>
    </div>
</body>
</html>
