<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <svg width="300" height="300" style="border:1px solid blue">
    <line x1="10" y1="10" x2="250" y2="100" stroke="red" stroke-width="4"></line>
    <line x1="50" y1="110" x2="200" y2="200" stroke="green" stroke-width="4"></line>
    <line x1="50" y1="230" x2="230" y2="50" stroke="black" stroke-width="4"></line>
  </svg>
  <svg style="border:solid red">
    <line x1="400" y1="200" stroke="yellow" stroke-width="2"></line>
  </svg>
  <svg height="300" width="300" style="border:1px solid">
    <circle cx="150" cy="150" r="100" stroke="red" stroke-width="3" fill="green"/>
    <!-- <line x1="300" y1="300" stroke="blue" stroke-width="2"></line>
    <line x1="300" y1="0" x2="0" y2="300" stroke="blue" stroke-width="2"></line>
    <line x1="150" y1="0" x2="150" y2="300" stroke="blue" stroke-width="2"></line>
    <line x1="0" y1="150" x2="300" y2="150" stroke="blue" stroke-width="2"></line> -->
    <ellipse cx="150" cy="150" rx="30" ry="100" stroke="red" stroke-width="5" fill="blue"/>
    <line x1="150" x2="150" y1="50" y2="250" stroke="red" stroke-width="4"/>
    <line x1="120" x2="180" y1="150" y2="150" stroke="red" stroke-width="4"/>
  </svg>
  <svg height="300" width="300" style="border:1px solid blue">
    <line x1="0" y1="0" x2="300" y2="300" stroke="blue" stroke-width="2"></line>
    <line x1="300" y1="0" x2="0" y2="300" stroke="blue" stroke-width="2"></line>
    <line x1="150" y1="0" x2="150" y2="300" stroke="blue" stroke-width="2"></line>
    <line x1="0" y1="150" x2="300" y2="150" stroke="blue" stroke-width="2"></line>
  </svg>
  <svg height="500" width="500" style="border:1px solid">
    <rect height="150" width="250" fill="lightblue" stroke="blue" stroke-width="10"/>
    <rect height="200" width="250" x="50" y="200" rx="250" ry="200" stroke="purple" fill="pink" stroke-width="10"/>
  </svg>
  <svg height="300" width="300" style="border:1px solid blue">
    <line x1="150" y1="50" x2="100" y2="100" stroke="red"/>
    <line x1="150" y1="50" x2="200" y2="100" stroke="red"/>
    <rect x="100" y="100" height="100" width="100" stroke="red" fill="white"/>
    <rect x="125" y="125" width="50" height="75" stroke="red" fill="white"/>
  </svg>
  <svg height="300" width="300" style="border:1px solid blue">
    <circle cx="100" cy="100" r="75" stroke="black" fill="blue"/>
    <circle cx="150" cy="50" r="100" stroke="white" fill="white"/>
  </svg>
  <svg height="500" width="500" style="border:1px solid blue">
    <polygon points="50,400,200,50,350,400,200,250" fill="white" stroke="yellow" stroke-width="5"/>
  </svg>
  <svg height="500" width="500" style="border:1px solid blue">
    <polygon points="50,300,200,50,350,300,200,450,50,300,200,450,350,100" fill="white" stroke="yellow" stroke-width="5"/>
  </svg>
  <svg height="500" width="500" style="border:1px solid blue">
    <polygon points="50,400,200,50,350,400,50,100,350,100" fill="white" stroke="yellow" stroke-width="5"/>
  </svg>
  <svg height="300" width="300" style="border:1px solid blue">
    <!-- <circle cx="150" cy="300" r="90" fill="green"/>
    <circle cx="150" cy="300" r="110" fill="green"/> -->
    <circle cx="150" cy="300" r="90" fill="green"/>
    <circle cx="150" cy="300" r="70" fill="blue"/>
    <circle cx="150" cy="300" r="50" fill="indigo"/>
    <circle cx="150" cy="300" r="30" fill="violet"/>
  </svg>
</body>
</html>
