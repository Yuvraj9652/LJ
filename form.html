<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="#" method="get">
    <fieldset>
      <legend>Information</legend>
      <label for="uname">Username</label>
      <input type="text" id="uname" name="uname" autofocus autocomplete="on" placeholder="User name" maxlength="20" required/>
      <br>
      <br>
      <label>Email</label>
      <input type="email" name="eid" placeholder="abc@gmail.com" required/>
      <br>
      <br>
      <label for="upass">Password</label>
      <input type="password" name="upass" autofocus placeholder="Abc@123" required/>
      <br>
      <br>
      <label>Phone Number</label>
      <input type="tel" name="phone" placeholder="9876543210" required/>
      <br>
      <br>
      <label>Date of Birth</label>
      <input type="date" name="dob"/>
      <br>
      <input type="submit" value="submit"/>
    </fieldset>
  </form>
</body>
</html>
